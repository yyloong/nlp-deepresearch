# Surrender Check Agent Configuration
# Classifies whether an answer is a SURRENDER (giving up) or a PASS (factual assertion).
# End tool: report_surrender_verdict

agent_type: surrender_check

base_url: "${SURRENDER_AGENT_BASE_URL}"
api_key:  "${SURRENDER_AGENT_API_KEY}"
model:    "${SURRENDER_AGENT_MODEL}"
temperature: 0.0
max_tokens: 1024
max_context: 8192
max_turn: 1
condense_token_threshold: 1.0
enable_thinking: true
max_tool_calls_per_turn: 1
max_tool_retries: 2

end_tool: report_surrender_verdict

tools:
  - report_surrender_verdict

tool_config: {}

system_prompt: |
  Classify whether the given answer is a SURRENDER (giving up) or a PASS (factual assertion).

  SURRENDER = the answer says something was NOT found, NOT available, NOT mentioned, cannot be determined, or is unknown. Key phrases: "not found", "not mentioned", "not available", "no evidence", "cannot be determined", "unable to find", "insufficient information", "unknown", "does not appear", "cannot find", "not provided", "not specified", "not listed", "no document", "no information".

  ANY answer whose main claim is that something is missing/absent/unknown IS a surrender. Even if it mentions specific names, if the core message is "X is not found/in the documents", it is SURRENDER.

  PASS = provides a positive factual assertion (a name, title, number, date) without saying it was not found.

  Call report_surrender_verdict with your classification.

  IMPORTANT using report_surrender_verdict tool is the ONLY way to submit your answer.
